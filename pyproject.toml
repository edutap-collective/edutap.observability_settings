[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edutap.observability_settings"
# 0.1.3 rather than releasing 0.1.2 to PyPI, for the same reason edutap.data_models
# went to 0.2.2: the tag `v0.1.2` points at the commit that followed data_models to
# v0.2.1, which is *before* the release workflow existed. A GitHub Release on it fires
# the event and finds no workflow at that ref, so nothing runs. Moving the tag was the
# alternative and is worse -- consumers fetch it as a git reference today.
#
# From here one version means one tag means one commit.
#
# 0.1.4, not 0.2.0: `instrument_fastapi_safely` and the `fastapi` extra are purely
# additive -- nothing existing changed shape or behaviour. The bound decides it as
# much as the semantics do: consumers pin `>=0.1.3,<0.2` (lmu_edutap_worker does),
# and a minor bump would drop them out of range for a release that only gives them
# a function they need not call.
version = "0.1.4"
description = "Error reporting, tracing and structured logging, wired the same way in every eduTAP service"
readme = "README.md"
requires-python = ">=3.13"
license = "EUPL-1.2"
authors = [{ name = "eduTAP" }]
# No `License ::` classifier: `license` above is a PEP 639 SPDX expression, and the
# two together are rejected by the build backend rather than merely redundant.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
# Unlike edutap.data_models, this package is allowed its dependencies: wiring three
# backends is what it exists for, and a service that installs it has already decided
# to carry them. What it must not grow is a dependency on any eduTAP service -- it is
# imported before a service resolves its own settings, so it can know nothing about
# them.
dependencies = [
    # A range, not a pinned git reference, and that is the whole point of publishing
    # edutap.data_models. A PEP 508 direct reference cannot carry a version specifier
    # -- the grammar makes URL and range mutually exclusive -- so a tag here was not a
    # strict choice but the only expressible one, and it forced every consumer to move
    # in lockstep: two different tags for one name are two identities, which no
    # resolver can reconcile.
    #
    # Upper bound at the next minor because this package reads the settings mixins and
    # the runtime helpers directly; a 0.x minor is where those may change shape.
    "edutap.data_models>=0.2.1,<0.3",
    "logfire>=4.40",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sentry-sdk>=2.67",
    "structlog>=25",
]

[project.optional-dependencies]
dev = [
    # The `fastapi` extra of *this* package, self-referentially: the instrumentation
    # tests need the FastAPI half of logfire, and base `logfire` does not carry it --
    # `logfire/_internal/integrations/fastapi.py` raises `RuntimeError` when
    # `opentelemetry-instrumentation-fastapi` is missing. Listing `fastapi` and
    # `httpx` alone is what a local venv gets away with once somebody has installed
    # the extra by hand; CI installs `.[dev]` into an empty environment and every
    # `instrument_fastapi_safely` test errors there. A self-referential extra is
    # valid packaging (PEP 508 allows a project to depend on itself by name) and is
    # resolved by pip and uv alike.
    "edutap.observability_settings[fastapi]",
    "fastapi",
    "httpx",
    "pdbp",
    "pytest>=8.2",
    # Pinned to one minor: ruff's isort classification changed between 0.14 and 0.16
    # and started flagging files that were clean before, so an open floor makes local
    # runs and CI disagree over time. Keep the hook rev in .pre-commit-config in step.
    "ruff>=0.16,<0.17",
    "ty",
]
# The FastAPI half of logfire, kept out of the core install: a worker configures its
# logging from this package and must not have to carry a web framework's
# instrumentation to do it.
fastapi = ["logfire[fastapi]>=4.40"]
docs = ["myst-parser", "sphinx>=8"]

[project.urls]
Source = "https://github.com/edutap-collective/edutap.observability_settings"
Issues = "https://github.com/edutap-collective/edutap.observability_settings/issues"

[tool.hatch.metadata]
# `allow-direct-references` is gone with the reason it was added for: edutap.data_models
# was the only direct reference here, and it is a range now. Not left standing as a
# harmless leftover -- PyPI refuses a distribution whose metadata carries a direct
# reference, so with the flag still set a future `pkg @ git+...` would build cleanly,
# pass CI, and fail at upload with a message about metadata rather than about the line
# somebody wrote. Without it, hatchling refuses at build time, where the mistake is.

[tool.hatch.build.targets.wheel]
packages = ["src/edutap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "D", "S"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101"]
